<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1235"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="إدارة البوفيه"><meta name="description" content="إدارة مشتريات ومنيو ووصفات البوفيه">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192-v16.png"><link rel="icon" type="image/png" href="icon-192-v16.png">

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="polish.css">
</head>
<body>
<div class="app-shell">

    <div class="brand"><div class="brand-mark"><img src="icon-192-v16.png" alt="" width="38" height="38"></div><div><strong>إدارة البوفيه</strong><small>تخطيط · مشتريات · قرارات</small></div></div>
    <div class="nav-caption">القائمة</div>
    <nav id="sideNav" aria-label="أقسام البرنامج"></nav>

  <div class="main-pane">
    <header class="topbar"><div class="top-title"><button class="icon-btn mobile-menu" id="menuButton" aria-label="القائمة">☰</button><img class="top-brand-icon" src="icon-192-v16.png" width="40" height="40" alt=""><div><div class="eyebrow">BUFFET OPERATIONS</div><h1 id="pageTitle">الرئيسية</h1></div></div><div class="top-actions"><div class="sync-pill" id="syncStatus"><span class="status-dot"></span> محلي فقط</div><button class="ghost-btn" data-action="export" title="نسخة احتياطية">نسخة احتياطية</button></div></header>
    <main id="view" tabindex="-1" aria-live="polite"></main>
  </div>
</div>
<nav class="bottom-nav" id="bottomNav" aria-label="تنقل سريع"></nav>
<div id="modalRoot"></div><div id="toast" role="status" aria-live="polite"></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>
